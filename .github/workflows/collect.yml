name: Collect bus fares
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
concurrency:
  group: bus-fare-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Database not configured yet
        if: env.DATABASE_URL == ''
        run: echo '::notice::Set the DATABASE_URL repository secret to start cloud collection.'
      - uses: actions/checkout@v4
        if: env.DATABASE_URL != ''
      - uses: actions/setup-node@v4
        if: env.DATABASE_URL != ''
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        if: env.DATABASE_URL != ''
      - run: npm run collect:cloud
        if: env.DATABASE_URL != ''
